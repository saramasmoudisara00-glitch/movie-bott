<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Watch Movie</title>
  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    .container {
      padding: 20px;
    }

    iframe {
      width: 100%;
      height: 80vh;
      border: none;
    }

    .title {
      font-size: 20px;
      margin: 10px 0;
    }

    .back {
      color: white;
      text-decoration: none;
      display: inline-block;
      margin-top: 10px;
      background: red;
      padding: 8px 15px;
      border-radius: 5px;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="title" id="title">Loading...</div>

  <!-- 🎬 video player -->
  <iframe id="player" allowfullscreen></iframe>

  <br>
  <a class="back" href="/">⬅ Back</a>
</div>

<script>
  // نجيب id من الرابط
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  // نعرض id (لاحقاً نربطوه بـ TMDB)
  document.getElementById("title").innerText = "Movie ID: " + id;

  // 🎬 تشغيل الفيلم (demo player)
  // لاحقاً نبدلوه بـ API حقيقي
  document.getElementById("player").src =
    "https://vidsrc.to/embed/movie/" + id;
</script>

</body>
</html>
<script>
  // 1. نجيب id من الرابط
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  // مفتاح الـ API الخاص بـ TMDB (حطي المفتاح تاعك هنا)
  const TMDB_API_KEY = "YOUR_TMDB_API_KEY"; 

  // 2. تشغيل الفيلم في الـ Player مباشرة باستخدام الـ ID
  if (id) {
    document.getElementById("player").src = "https://vidsrc.to/embed/movie/" + id;

    // 3. جلب اسم الفيلم من TMDB وعرضه في العنوان
    fetch(`https://api.themoviedb.org/3/movie/${id}?api_key=${TMDB_API_KEY}&language=ar`)
      .then(response => response.json())
      .then(data => {
        if (data.title) {
          document.getElementById("title").innerText = data.title;
        } else {
          document.getElementById("title").innerText = "مشاهدة الفيلم";
        }
      })
      .catch(() => {
        document.getElementById("title").innerText = "مشاهدة الفيلم";
      });
  } else {
    document.getElementById("title").innerText = "خطأ: لم يتم تحديد فيلم!";
  }
</script>
