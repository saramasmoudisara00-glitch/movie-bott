<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Watch Movie</title>

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    .title {
      font-size: 22px;
      padding: 15px;
      color: #E50914;
      font-weight: bold;
    }

    iframe {
      width: 100%;
      height: 85vh;
      border: none;
    }
  </style>
</head>

<body>

<div class="title" id="title">Loading...</div>

<iframe id="player" allowfullscreen></iframe>

<script>
  const params = new URLSearchParams(window.location.search);

  const id = params.get("id");
  const type = params.get("type") || "movie";

  if (id) {
    const embedUrl = `https://multiembed.mov/?video_id=${id}`;

    document.getElementById("player").src = embedUrl;

    document.getElementById("title").innerText = "Now Playing 🎬";
  } else {
    document.body.innerHTML = "<h2 style='color:white'>No movie selected</h2>";
  }
</script>

</body>
</html>
