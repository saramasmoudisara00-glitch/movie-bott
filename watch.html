<script>
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  const TMDB_API_KEY = "2df7966b11c2fa17ff9606fd8eb710fb";

  if (!id) {
    document.getElementById("title").innerText = "خطأ: لم يتم تحديد فيلم!";
  } else {

    // 🎬 تشغيل الفيلم
    document.getElementById("player").src =
      "https://vidsrc.icu/embed/movie/" + id;

    // 📌 جلب اسم الفيلم
    fetch(`https://api.themoviedb.org/3/movie/${id}?api_key=${TMDB_API_KEY}&language=ar`)
      .then(res => res.json())
      .then(data => {
        document.getElementById("title").innerText =
          data.title || "مشاهدة الفيلم";
      })
      .catch(() => {
        document.getElementById("title").innerText = "مشاهدة الفيلم";
      });
  }
</script>
