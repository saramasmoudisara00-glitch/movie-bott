<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Watch Movie</title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  text-align: center;
  font-family: Arial;
}

.title {
  padding: 10px;
  font-size: 20px;
  color: #e50914;
}

iframe {
  width: 100%;
  height: 85vh;
  border: none;
}
</style>
</head>

<body>

<div class="title">🎬 Loading...</div>

<iframe id="player"></iframe>

<script>
const params = new URLSearchParams(window.location.search);

const id = params.get("id");
const type = params.get("type") || "movie";

if (id) {
  // 🎬 مصدر واحد بسيط (أكثر استقرار)
  const url = `https://multiembed.mov/?video_id=${id}`;

  document.getElementById("player").src = url;

  document.querySelector(".title").innerText = "Now Playing 🎬";
} else {
  document.body.innerHTML = "<h2>No movie selected</h2>";
}
</script>

</body>
</html>
