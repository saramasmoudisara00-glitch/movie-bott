<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Watch Movie</title>

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    .title {
      font-size: 22px;
      padding: 15px;
      color: #E50914;
      font-weight: bold;
    }

   <iframe id="player" allowfullscreen></iframe>

<script>
  const params = new URLSearchParams(window.location.search);

  const id = params.get("id");
  const type = params.get("type") || "movie";

  if (id) {
    // جرّبي سيرفر واحد مستقر
    const embedUrl = `https://multiembed.mov/?video_id=${id}`;

    document.getElementById("player").src = embedUrl;
  } else {
    document.body.innerHTML = "No movie selected";
  }
</script>
