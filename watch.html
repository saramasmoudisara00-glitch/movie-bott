<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Watch</title>
<style>
body {
  background: black;
  color: white;
  text-align: center;
  font-family: Arial;
}
a {
  display: inline-block;
  margin-top: 80px;
  padding: 15px 20px;
  background: #e50914;
  color: white;
  text-decoration: none;
  border-radius: 10px;
  font-size: 18px;
}
</style>
</head>

<body>

<h2>🎬 Watch Movie</h2>

<a id="watch" target="_blank">▶️ Play Now</a>

<script>
const id = new URLSearchParams(location.search).get("id");

if(id){
  document.getElementById("watch").href =
    `https://multiembed.mov/?video_id=${id}`;
} else {
  document.body.innerHTML = "No movie selected";
}
</script>

</body>
</html>
