<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Watch Movie</title>
  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    .container {
      padding: 20px;
    }

    iframe {
      width: 100%;
      height: 80vh;
      border: none;
    }

    .title {
      font-size: 20px;
      margin: 10px 0;
    }

    .back {
      color: white;
      text-decoration: none;
      display: inline-block;
      margin-top: 10px;
      background: red;
      padding: 8px 15px;
      border-radius: 5px;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="title" id="title">Loading...</div>

  <!-- 🎬 video player -->
  <iframe id="player" allowfullscreen></iframe>

  <br>
  <a class="back" href="/">⬅ Back</a>
</div>

<script>
  // نجيب id من الرابط
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  // نعرض id (لاحقاً نربطوه بـ TMDB)
  document.getElementById("title").innerText = "Movie ID: " + id;

  // 🎬 تشغيل الفيلم (demo player)
  // لاحقاً نبدلوه بـ API حقيقي
  document.getElementById("player").src =
    "https://vidsrc.to/embed/movie/" + id;
</script>

</body>
</html>
